<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="340">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171" />
    </marker>
  </defs>

  <!-- Fundo escuro sutil -->
  <rect x="0" y="0" width="960" height="340" rx="8" fill="#050811" />

  <!-- 1. ENTRADA R(s) -->
  <rect x="15" y="146" width="46" height="28" rx="14" fill="#131c2e" stroke="#38bdf8" stroke-width="2" />
  <text x="38" y="164" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">R(s)</text>

  <!-- Linha R(s) -> Pre-filtro G_pre -->
  <path d="M 61 160 L 90 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />

  <!-- Pre-filtro G_pre -->
  <text x="125" y="132" text-anchor="middle" fill="#94a3b8" font-size="8.5">G_pre (Cascata)</text>
  <rect x="95" y="138" width="60" height="44" rx="5" fill="#0d1424" stroke="#38bdf8" stroke-width="2" />
  <text x="125" y="154" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">2</text>
  <line x1="105" y1="160" x2="145" y2="160" stroke="#64748b" stroke-width="1.2" />
  <text x="125" y="173" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">s + 2</text>

  <!-- No de Ramificacao R1 -->
  <circle cx="175" cy="160" r="4.5" fill="#38bdf8" />
  <path d="M 155 160 L 175 160" stroke="#38bdf8" stroke-width="2" fill="none" />

  <!-- RAMO FEEDFORWARD (Cima - Laranja) -->
  <path d="M 175 160 L 175 45 L 805 45 L 805 142" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arr-amber)" />
  <text x="490" y="36" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="bold">Canal Feedforward Direto (G_ff = 1)</text>

  <!-- Ramo R1 -> Somador Sigma1 -->
  <path d="M 175 160 L 205 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />
  <text x="195" y="153" fill="#10b981" font-size="10" font-weight="bold">+</text>

  <!-- SOMADOR PRINCIPAL SIGMA1 -->
  <circle cx="218" cy="160" r="13" fill="#131c2e" stroke="#38bdf8" stroke-width="2" />
  <text x="218" y="164" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">Σ1</text>
  <text x="207" y="186" fill="#f87171" font-size="11" font-weight="bold">-</text>
  <text x="228" y="186" fill="#f87171" font-size="11" font-weight="bold">-</text>

  <!-- Linha Sigma1 -> Controlador Paralelo (Bifurcacao) -->
  <path d="M 231 160 L 255 160" stroke="#38bdf8" stroke-width="2" fill="none" />
  <circle cx="255" cy="160" r="4" fill="#38bdf8" />

  <!-- CONTROLADOR PARALELO PI -->
  <!-- Ramo Superior: Kp = 2 -->
  <path d="M 255 160 L 255 125 L 275 125" stroke="#38bdf8" stroke-width="1.8" fill="none" marker-end="url(#arr-blue)" />
  <rect x="278" y="108" width="48" height="34" rx="4" fill="#0d1424" stroke="#a78bfa" stroke-width="1.8" />
  <text x="302" y="129" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="bold">Kp = 2</text>
  <path d="M 326 125 L 345 125 L 345 147" stroke="#38bdf8" stroke-width="1.8" fill="none" marker-end="url(#arr-blue)" />
  <text x="336" y="142" fill="#10b981" font-size="9" font-weight="bold">+</text>

  <!-- Ramo Inferior: Ki/s = 4/s -->
  <path d="M 255 160 L 255 195 L 275 195" stroke="#38bdf8" stroke-width="1.8" fill="none" marker-end="url(#arr-blue)" />
  <rect x="278" y="176" width="48" height="38" rx="4" fill="#0d1424" stroke="#a78bfa" stroke-width="1.8" />
  <text x="302" y="191" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">4</text>
  <line x1="286" y1="195" x2="318" y2="195" stroke="#64748b" stroke-width="1.2" />
  <text x="302" y="208" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">s</text>
  <path d="M 326 195 L 345 195 L 345 173" stroke="#38bdf8" stroke-width="1.8" fill="none" marker-end="url(#arr-blue)" />
  <text x="336" y="183" fill="#10b981" font-size="9" font-weight="bold">+</text>

  <!-- Somador do Controlador Sigma_c -->
  <circle cx="345" cy="160" r="10" fill="#131c2e" stroke="#a78bfa" stroke-width="1.8" />
  <text x="345" y="163" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="bold">Σc</text>

  <!-- Linha Sigma_c -> Somador de Disturbio Sigma_d -->
  <path d="M 355 160 L 385 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />
  <text x="374" y="153" fill="#10b981" font-size="10" font-weight="bold">+</text>

  <!-- ENTRADA DE DISTURBIO D(s) -->
  <rect x="375" y="80" width="42" height="24" rx="6" fill="#131c2e" stroke="#f87171" stroke-width="1.8" />
  <text x="396" y="96" text-anchor="middle" fill="#f8fafc" font-size="9.5" font-weight="bold">D(s)</text>
  <path d="M 396 104 L 396 147" stroke="#f87171" stroke-width="1.8" fill="none" marker-end="url(#arr-red)" />
  <text x="403" y="142" fill="#10b981" font-size="9" font-weight="bold">+</text>

  <!-- Somador de Disturbio Sigma_d -->
  <circle cx="396" cy="160" r="11" fill="#131c2e" stroke="#f87171" stroke-width="1.8" />
  <text x="396" y="163" text-anchor="middle" fill="#f87171" font-size="8" font-weight="bold">Σd</text>

  <!-- Linha Sigma_d -> Somador Interno Sigma2 -->
  <path d="M 407 160 L 440 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />
  <text x="428" y="153" fill="#10b981" font-size="10" font-weight="bold">+</text>

  <!-- SOMADOR DA MALHA INTERNA SIGMA2 -->
  <circle cx="452" cy="160" r="12" fill="#131c2e" stroke="#c084fc" stroke-width="2" />
  <text x="452" y="164" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Σ2</text>
  <text x="452" y="183" fill="#10b981" font-size="11" font-weight="bold">+</text>

  <!-- Linha Sigma2 -> Planta G1 -->
  <path d="M 464 160 L 495 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />

  <!-- PLANTA 1: G1(s) = 3/(s+1) -->
  <text x="525" y="132" text-anchor="middle" fill="#94a3b8" font-size="8.5">G1 (Malha Interna)</text>
  <rect x="498" y="138" width="54" height="44" rx="5" fill="#0d1424" stroke="#c084fc" stroke-width="2" />
  <text x="525" y="154" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">3</text>
  <line x1="506" y1="160" x2="544" y2="160" stroke="#64748b" stroke-width="1.2" />
  <text x="525" y="173" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">s + 1</text>

  <!-- NO INTERMEDIARIO X -->
  <circle cx="585" cy="160" r="4.5" fill="#c084fc" />
  <path d="M 552 160 L 585 160" stroke="#38bdf8" stroke-width="2" fill="none" />
  <text x="585" y="150" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="bold">X</text>

  <!-- LACO DE REALIMENTACAO POSITIVA (H1 = 1) -->
  <path d="M 585 160 L 585 220 L 452 220 L 452 174" stroke="#c084fc" stroke-width="1.8" fill="none" marker-end="url(#arr-purple)" />
  <rect x="495" y="210" width="50" height="20" rx="3" fill="#0d1424" stroke="#c084fc" stroke-width="1.5" />
  <text x="520" y="224" text-anchor="middle" fill="#c084fc" font-size="8.5" font-weight="bold">H1 = 1 (+)</text>

  <!-- LACO DE REALIMENTACAO DE TAXA CRUZADA (H_taxa = 1) -->
  <path d="M 585 160 L 585 260 L 218 260 L 218 175" stroke="#ec4899" stroke-width="1.8" fill="none" marker-end="url(#arr-red)" />
  <rect x="365" y="250" width="70" height="20" rx="3" fill="#0d1424" stroke="#ec4899" stroke-width="1.5" />
  <text x="400" y="264" text-anchor="middle" fill="#ec4899" font-size="8.5" font-weight="bold">H_taxa = 1 (-)</text>

  <!-- Linha X -> Planta G2 -->
  <path d="M 585 160 L 635 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />

  <!-- PLANTA 2: G2(s) = 2/(s+3) -->
  <text x="665" y="132" text-anchor="middle" fill="#94a3b8" font-size="8.5">G2 (Cascata)</text>
  <rect x="638" y="138" width="54" height="44" rx="5" fill="#0d1424" stroke="#38bdf8" stroke-width="2" />
  <text x="665" y="154" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">2</text>
  <line x1="646" y1="160" x2="684" y2="160" stroke="#64748b" stroke-width="1.2" />
  <text x="665" y="173" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">s + 3</text>

  <!-- NO DE SAIDA DA PLANTA Y -->
  <circle cx="725" cy="160" r="4.5" fill="#10b981" />
  <path d="M 692 160 L 725 160" stroke="#38bdf8" stroke-width="2" fill="none" />
  <text x="725" y="150" text-anchor="middle" fill="#10b981" font-size="9" font-weight="bold">Y</text>

  <!-- LACO GLOBAL DE RETORNO COM SENSOR DINAMICO H_ext = 2 -->
  <path d="M 725 160 L 725 300 L 205 300 L 205 260 L 214 174" stroke="#38bdf8" stroke-width="1.8" fill="none" marker-end="url(#arr-blue)" />
  <rect x="420" y="290" width="80" height="20" rx="3" fill="#0d1424" stroke="#38bdf8" stroke-width="1.5" />
  <text x="460" y="304" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="bold">H_ext = 2 (-)</text>

  <!-- Linha Y -> Somador Final Sigma4 -->
  <path d="M 725 160 L 793 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />
  <text x="782" y="153" fill="#10b981" font-size="10" font-weight="bold">+</text>
  <text x="811" y="146" fill="#f59e0b" font-size="9" font-weight="bold">+</text>

  <!-- SOMADOR DE SAIDA SIGMA4 -->
  <circle cx="805" cy="160" r="12" fill="#131c2e" stroke="#10b981" stroke-width="2" />
  <text x="805" y="164" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Σ4</text>

  <!-- Linha Sigma4 -> Saida C(s) -->
  <path d="M 817 160 L 880 160" stroke="#10b981" stroke-width="2.2" fill="none" marker-end="url(#arr-green)" />

  <!-- SAIDA FINAL C(s) -->
  <rect x="885" y="146" width="46" height="28" rx="14" fill="#131c2e" stroke="#10b981" stroke-width="2" />
  <text x="908" y="164" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">C(s)</text>
</svg>
